{% extends "base.html" %}
{% block body %}

<div class="card">
  <div style="text-align:center;margin-bottom:16px;padding:14px;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc">
    <div style="font-size:18px;font-weight:800;margin-bottom:6px">Địa chỉ văn phòng</div>
    <div style="line-height:1.6;color:#374151">
      Tầng 1 - 2 Landmark 81<br>
      Số 720A Điện Biên Phủ, <b>phường Thạnh Mỹ Tây</b>, Thành phố Hồ Chí Minh.
    </div>
  </div>

  <div class="tabs">
    <button onclick="show('login')">Đăng nhập</button>
    <button onclick="show('register')">Đăng ký</button>
  </div>

  <div id="login">
    <h2>Đăng nhập</h2>

    <form method="post" action="/login">
      <label>Số điện thoại</label>
      <input name="phone" required>

      <label>Mật khẩu</label>
      <input name="password" type="password" required>

      <button class="btn">Đăng nhập</button>
    </form>
  </div>

  <div id="register" style="display:none">
    <h2>Đăng ký</h2>

    <form method="post" action="/register" onsubmit="return checkPassword()">
      <label>Họ và tên</label>
      <input name="name" required>

      <label>Số điện thoại</label>
      <input name="phone" required>

      <label>Mật khẩu</label>
      <input
        id="register_password"
        name="password"
        type="password"
        required
      >

      <label>Nhập lại mật khẩu</label>
      <input
        id="confirm_password"
        name="confirm_password"
        type="password"
        required
      >

      <div id="password_error"
           style="display:none;color:#dc2626;margin-top:8px">
        Mật khẩu nhập lại không khớp.
      </div>

      <button class="btn">Đăng ký</button>
    </form>
  </div>
</div>

<script>
function show(x) {
  document.getElementById('login').style.display =
    x === 'login' ? 'block' : 'none';

  document.getElementById('register').style.display =
    x === 'register' ? 'block' : 'none';
}

function checkPassword() {
  const password =
    document.getElementById('register_password').value;

  const confirmPassword =
    document.getElementById('confirm_password').value;

  if (password !== confirmPassword) {
    document.getElementById('password_error').style.display = 'block';
    return false;
  }

  document.getElementById('password_error').style.display = 'none';
  return true;
}
</script>

{% endblock %}
