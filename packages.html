{% extends "base.html" %}
{% block body %}
<style>
.package-shell{width:100%;max-width:720px;margin:0 auto}.stepbar{display:flex;gap:5px;margin:10px 0 12px}.stepbar span{flex:1;text-align:center;padding:8px 3px;border-radius:10px;background:#f1f5f9;color:#64748b;font-size:10px;font-weight:800}.stepbar .active{background:#0f172a;color:#f8e7a8}.package-hero{padding:21px 18px;margin-bottom:12px;border-radius:19px;background:linear-gradient(145deg,#0f172a,#172554);color:#fff}.package-hero .eyebrow{color:#f8e7a8;font-size:11px;font-weight:900}.package-hero h1{margin:7px 0 5px;font-size:25px}.package-hero p{margin:0;color:#cbd5e1;font-size:13px}.package-card{background:#fff;border:1px solid #e5e7eb;border-radius:19px;padding:16px}.package-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.package-option{display:block;cursor:pointer;position:relative}.package-option input{position:absolute;opacity:0}.package-box{border:1.5px solid #e2e8f0;border-radius:15px;padding:13px;min-height:108px;background:#fff}.package-option input:checked + .package-box{border-color:#c9952e;background:#0f172a;color:#fff;box-shadow:0 7px 18px rgba(15,23,42,.13)}.package-points{font-size:20px;font-weight:900;margin-bottom:9px}.reward{font-size:12px;color:#64748b;border-top:1px solid #e5e7eb;padding-top:8px}.reward strong{display:block;color:#a66f0b;font-size:15px;margin-top:2px}.package-option input:checked + .package-box .reward{color:#cbd5e1;border-color:#334155}.package-option input:checked + .package-box .reward strong{color:#f8e7a8}.package-submit{margin-top:14px!important;max-width:none!important;width:100%!important;background:linear-gradient(135deg,#c9952e,#e0b84e)!important;color:#0f172a!important;font-weight:900!important}.help{text-align:center;color:#64748b;font-size:11px;line-height:1.5;margin-top:11px}@media(min-width:700px){.package-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:430px){.package-card{padding:12px}.package-grid{gap:7px}.package-box{padding:11px}.package-points{font-size:18px}}
</style>
<div class="package-shell">
  <div class="stepbar"><span class="active">1 Chọn gói</span><span>2 Nhận mã</span><span>3 Nhiệm vụ</span><span>4 Xong</span></div>
  <section class="package-hero"><div class="eyebrow">BƯỚC 1/4</div><h1>Chọn một gói điểm</h1><p>Chạm vào gói bạn muốn, sau đó bấm Tiếp tục.</p></section>
  <section class="package-card">
    <form method="post" action="/choose-package">
      <div class="package-grid">
        {% for p in packages %}
        <label class="package-option"><input type="radio" name="package_idx" value="{{ loop.index0 }}" required><div class="package-box"><div class="package-points">{{ p[0] }}</div><div class="reward">Điểm thưởng<strong>+{{ p[1] }}</strong></div></div></label>
        {% endfor %}
      </div>
      <button class="btn package-submit" type="submit">Tiếp tục →</button>
      <div class="help">Bước tiếp theo: liên hệ CSKH để nhận mã tham gia. Điểm là điểm nội bộ của hệ thống.</div>
    </form>
  </section>
</div>
{% endblock %}
