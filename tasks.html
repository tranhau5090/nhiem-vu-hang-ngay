{% extends "base.html" %}{% block body %}
<div class="card"><h2>Thực hiện nhiệm vụ</h2>
<div style="font-weight:700;text-align:center"><span id="count">{{prog['likes']}}</span>/10</div>
<div class="progress"><div id="bar" class="bar" style="width:{{prog['likes']*10}}%"></div></div>
<div id="tasks">
{% for p in products %}
{% set task_id = loop.index %}
<div class="task">
  <div><b>{{p[0]}}</b><div class="small">{{p[1]}}</div></div>
  <button
    class="like"
    data-task-id="{{task_id}}"
    onclick="likeOne(this)"
    {% if task_id in done_ids %}disabled{% endif %}
  >{% if task_id in done_ids %}♥ Đã Like{% else %}♡ Like{% endif %}</button>
</div>
{% endfor %}
</div>
<a id="complete" class="btn" href="/complete" style="{% if prog['likes']<10 %}display:none{% endif %}">Hoàn thành 10/10</a>
</div>
<script>
async function likeOne(btn){
  if(btn.disabled) return;

  const taskId = Number(btn.dataset.taskId);
  btn.disabled = true;

  try{
    const r = await fetch('/like',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({task_id:taskId})
    });
    const d = await r.json();

    if(d.ok){
      btn.textContent='♥ Đã Like';
      document.getElementById('count').textContent=d.likes;
      document.getElementById('bar').style.width=(d.likes*10)+'%';
      if(d.likes>=10) document.getElementById('complete').style.display='block';
      return;
    }

    if(d.already_done){
      btn.textContent='♥ Đã Like';
      if(typeof d.likes !== 'undefined'){
        document.getElementById('count').textContent=d.likes;
        document.getElementById('bar').style.width=(d.likes*10)+'%';
      }
      return;
    }

    btn.disabled=false;
    alert(d.message || 'Không thể hoàn thành nhiệm vụ.');
  }catch(e){
    btn.disabled=false;
    alert('Không kết nối được máy chủ. Vui lòng thử lại.');
  }
}
</script>{% endblock %}
